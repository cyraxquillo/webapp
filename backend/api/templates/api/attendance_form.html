{% extends 'api/base.html' %}
{% block title %}Attendance update{% endblock %}
{% block page_heading %}Update record{% endblock %}
{% block content %}
<section class="page-shell"><form method="post" class="surface max-w-2xl">{% csrf_token %}<div class="form-grid">{% for field in form %}<label class="field full-field">{{ field.label }}{{ field }}{% if field.errors %}<small class="field-error">{{ field.errors.0 }}</small>{% endif %}</label>{% endfor %}</div><div class="form-actions"><a class="secondary-button" href="{% url 'attendance-list' %}">Cancel</a><button class="primary-button" type="submit">Save attendance</button></div></form></section>
{% endblock %}
